# GitHub Actions - Play Console への公開 (2026-08-15、2026-08-16 track を選択式に変更)
#
# 手動起動のみ (deploy.yml と同じ方針、push では公開されない)。
# track の既定値は internal (事故防止)。production は明示的に選んだ時だけ。
#
# 前提となる GitHub Secrets:
#   trianglelistfirebase      - Play Console と紐付けた service account の JSON 鍵の中身をそのまま
#   RELEASE_KEYSTORE_BASE64   - 正規のアップロード鍵 (TriangleListKey.jks, alias=trianglelistkey,
#                                SHA1 89:AD:18:BB:...) を base64 化したもの。
#                                2026-08-16 発見: 旧設定は signingConfigs.getByName("debug")
#                                (マシン依存の使い捨て鍵) を使っており、Play Console 登録済みの
#                                アップロード鍵と不一致でアップロードが 403 拒否されていた。
#                                gh secret set で直接設定済み (手動 base64 コピペでの文字化けを回避)。
#   RELEASE_KEYSTORE_PASSWORD - 上記 keystore の store password (= key password)。

name: Publish to Play Console

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "公開するフレーバー"
        required: true
        type: choice
        options:
          - free
          - full
          - both
        default: both
      track:
        description: "公開先トラック (production は実ユーザー全員に即時影響、慎重に)"
        required: true
        type: choice
        options:
          - internal
          - production
        default: internal

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore release keystore and write keystore.properties
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/trianglelist-release.keystore"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/trianglelist-release.keystore
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=trianglelistkey
          keyPassword=$RELEASE_KEYSTORE_PASSWORD
          EOF

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # push 型 CI (android-ci.yml) が既に共有ロジックを検証しているはずだが、公開直前に
      # app モジュールだけもう一度実走する (ここが red のまま公開するのは絶対に避ける)。
      - name: Run app module unit tests
        run: ./gradlew :app:testDevDebugUnitTest --no-daemon --build-cache

      - name: Publish free
        if: ${{ inputs.flavor == 'free' || inputs.flavor == 'both' }}
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.trianglelistfirebase }}
        run: ./gradlew :app:publishFreeReleaseBundle --track ${{ inputs.track }} --no-daemon --build-cache

      - name: Publish full
        if: ${{ inputs.flavor == 'full' || inputs.flavor == 'both' }}
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.trianglelistfirebase }}
        run: ./gradlew :app:publishFullReleaseBundle --track ${{ inputs.track }} --no-daemon --build-cache
